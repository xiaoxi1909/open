<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>将进酒 - 李白</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background: #0a0a0a;
            color: #f4e4c1;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* 水墨背景层 */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: linear-gradient(to bottom, #1a1a2e 0%, #0f0f1e 50%, #0a0a0a 100%);
        }

        .background::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://kimi-web-img.moonshot.cn/img/pic.616pic.com/395efadc5a99d20a5dd2f9501922ae9c0c0ed1ea.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.3;
            filter: grayscale(100%) contrast(1.2);
        }

        /* 动态水墨粒子效果 */
        .ink-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 20s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
            50% { opacity: 0.3; }
            100% { transform: translateY(-100vh) translateX(50px); opacity: 0; }
        }

        /* 主容器 */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 20px;
            position: relative;
            z-index: 1;
        }

        /* 标题区域 */
        header {
            text-align: center;
            margin-bottom: 60px;
            opacity: 0;
            animation: fadeIn 2s ease-out forwards;
        }

        h1 {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: 0.5em;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #f4e4c1 0%, #d4af37 50%, #f4e4c1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
            position: relative;
            display: inline-block;
        }

        h1::after {
            content: '將進酒';
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, transparent 0%, rgba(255,255,255,0.3) 50%, transparent 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .author {
            font-size: 1.5rem;
            color: #888;
            letter-spacing: 0.3em;
            font-weight: 400;
        }

        .dynasty {
            display: inline-block;
            background: rgba(212, 175, 55, 0.2);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-left: 10px;
            color: #d4af37;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        /* 诗歌内容区域 */
        .poem-container {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(244, 228, 193, 0.1);
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 
                        inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .poem-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.03) 0%, transparent 70%);
            pointer-events: none;
        }

        .stanza {
            margin-bottom: 40px;
            opacity: 0;
            transform: translateY(30px);
            transition: all 1s ease-out;
        }

        .stanza.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .line {
            font-size: 1.8rem;
            line-height: 2.5;
            text-align: center;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 5px 0;
            letter-spacing: 0.1em;
        }

        .line:hover {
            color: #d4af37;
            transform: scale(1.05);
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }

        /* 注释提示框 */
        .tooltip {
            position: fixed;
            background: rgba(20, 20, 30, 0.95);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 0.9rem;
            color: #ccc;
            max-width: 300px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        .tooltip.show {
            opacity: 1;
        }

        .tooltip::before {
            content: '';
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 5px solid transparent;
            border-right: 5px solid transparent;
            border-bottom: 5px solid rgba(212, 175, 55, 0.3);
        }

        /* 交互按钮 */
        .controls {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            gap: 15px;
            z-index: 100;
        }

        .btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: #d4af37;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            font-size: 1.2rem;
        }

        .btn:hover {
            background: rgba(212, 175, 55, 0.2);
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.3);
        }

        /* 酒杯动画 */
        .wine-cup {
            position: fixed;
            bottom: 100px;
            right: 50px;
            font-size: 3rem;
            opacity: 0.3;
            animation: floatCup 4s ease-in-out infinite;
            cursor: pointer;
            z-index: 10;
            transition: opacity 0.3s;
        }

        .wine-cup:hover {
            opacity: 0.8;
        }

        @keyframes floatCup {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        /* 逐字显示动画 */
        .char {
            display: inline-block;
            opacity: 0;
            transform: translateY(20px);
            animation: charIn 0.5s forwards;
        }

        @keyframes charIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 响应式 */
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; letter-spacing: 0.3em; }
            .line { font-size: 1.3rem; }
            .poem-container { padding: 30px 20px; }
            .controls { bottom: 20px; right: 20px; }
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(212, 175, 55, 0.5);
        }

        /* 音乐波动效果 */
        .music-waves {
            position: fixed;
            bottom: 30px;
            left: 30px;
            display: flex;
            gap: 5px;
            align-items: flex-end;
            height: 30px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .music-waves.active {
            opacity: 0.6;
        }

        .wave {
            width: 4px;
            background: linear-gradient(to top, #d4af37, transparent);
            border-radius: 2px;
            animation: wave 1s ease-in-out infinite;
        }

        .wave:nth-child(1) { height: 10px; animation-delay: 0s; }
        .wave:nth-child(2) { height: 20px; animation-delay: 0.1s; }
        .wave:nth-child(3) { height: 15px; animation-delay: 0.2s; }
        .wave:nth-child(4) { height: 25px; animation-delay: 0.3s; }
        .wave:nth-child(5) { height: 12px; animation-delay: 0.4s; }

        @keyframes wave {
            0%, 100% { transform: scaleY(0.5); }
            50% { transform: scaleY(1); }
        }
    </style>
</head>
<body>

    <div class="background"></div>
    <div class="ink-particles" id="particles"></div>

    <div class="container">
        <header>
            <h1>将进酒</h1>
            <div class="author">
                李白 <span class="dynasty">唐</span>
            </div>
        </header>

        <div class="poem-container" id="poem">
            <div class="stanza" data-index="0">
                <div class="line" data-note="你没看见吗？黄河之水是由天上而来，奔腾流向大海，永不回流。">君不见黄河之水天上来，奔流到海不复回。</div>
                <div class="line" data-note="你没看见吗？高堂之上，对着明镜悲叹白发，早晨还是青丝，傍晚就变成雪白。">君不见高堂明镜悲白发，朝如青丝暮成雪。</div>
            </div>

            <div class="stanza" data-index="1">
                <div class="line" data-note="人生得意之时应当尽情欢乐，不要让金杯空对着明月。">人生得意须尽欢，莫使金樽空对月。</div>
                <div class="line" data-note="上天生下我这样的材料，必定有用武之地，千金散尽还会再回来。">天生我材必有用，千金散尽还复来。</div>
                <div class="line" data-note="烹羊宰牛姑且作乐，应当一口气喝上三百杯。">烹羊宰牛且为乐，会须一饮三百杯。</div>
            </div>

            <div class="stanza" data-index="2">
                <div class="line" data-note="岑夫子、丹丘生，请喝酒，不要停杯。">岑夫子，丹丘生，将进酒，杯莫停。</div>
                <div class="line" data-note="让我为你们唱一首歌，请你们侧耳倾听。">与君歌一曲，请君为我倾耳听。</div>
            </div>

            <div class="stanza" data-index="3">
                <div class="line" data-note="钟鼓馔玉并不珍贵，只希望长醉不愿醒。">钟鼓馔玉不足贵，但愿长醉不复醒。</div>
                <div class="line" data-note="自古以来圣贤都寂寞，只有饮酒的人才能留传美名。">古来圣贤皆寂寞，惟有饮者留其名。</div>
                <div class="line" data-note="陈王曹植当年在平乐观设宴，一斗酒值十千钱，纵情欢乐。">陈王昔时宴平乐，斗酒十千恣欢谑。</div>
            </div>

            <div class="stanza" data-index="4">
                <div class="line" data-note="主人为什么说钱少，只管去买酒来让我们对饮。">主人何为言少钱，径须沽取对君酌。</div>
                <div class="line" data-note="五花马、千金裘，叫儿子拿出去换美酒，和你们一同消解万古长愁。">五花马，千金裘，呼儿将出换美酒，与尔同销万古愁。</div>
            </div>
        </div>
    </div>

    <div class="wine-cup" id="wineCup" title="点击干杯">🍶</div>

    <div class="music-waves" id="musicWaves">
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
    </div>

    <div class="controls">
        <button class="btn" id="playBtn" title="自动朗诵">▶</button>
        <button class="btn" id="lightBtn" title="切换氛围">💡</button>
    </div>

    <div class="tooltip" id="tooltip"></div>

    <script>
        // 创建水墨粒子
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.width = Math.random() * 100 + 50 + 'px';
                particle.style.height = particle.style.width;
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 15) + 's';
                container.appendChild(particle);
            }
        }

        // 逐行显示诗歌
        function revealPoem() {
            const stanzas = document.querySelectorAll('.stanza');
            stanzas.forEach((stanza, index) => {
                setTimeout(() => {
                    stanza.classList.add('visible');
                    // 每行内的字逐个显示
                    const lines = stanza.querySelectorAll('.line');
                    lines.forEach((line, lineIndex) => {
                        const text = line.textContent;
                        line.innerHTML = '';
                        text.split('').forEach((char, charIndex) => {
                            const span = document.createElement('span');
                            span.className = 'char';
                            span.textContent = char;
                            span.style.animationDelay = `${lineIndex * 0.5 + charIndex * 0.05}s`;
                            line.appendChild(span);
                        });
                    });
                }, index * 800);
            });
        }

        // 注释提示框
        const tooltip = document.getElementById('tooltip');
        const lines = document.querySelectorAll('.line');

        lines.forEach(line => {
            line.addEventListener('mouseenter', (e) => {
                const note = e.target.getAttribute('data-note');
                if (note) {
                    tooltip.textContent = note;
                    tooltip.classList.add('show');
                }
            });

            line.addEventListener('mousemove', (e) => {
                tooltip.style.left = e.clientX + 'px';
                tooltip.style.top = (e.clientY - 60) + 'px';
            });

            line.addEventListener('mouseleave', () => {
                tooltip.classList.remove('show');
            });
        });

        // 酒杯交互
        let wineLevel = 0;
        document.getElementById('wineCup').addEventListener('click', function() {
            wineLevel++;
            this.style.transform = `rotate(${wineLevel * 15}deg)`;
            this.style.opacity = Math.max(0.1, 0.3 + (wineLevel * 0.1));
            
            // 创建干杯效果
            const cheers = document.createElement('div');
            cheers.textContent = '干杯！';
            cheers.style.cssText = `
                position: fixed;
                bottom: 150px;
                right: 50px;
                color: #d4af37;
                font-size: 1.5rem;
                pointer-events: none;
                animation: floatUp 2s forwards;
                text-shadow: 0 0 20px rgba(212, 175, 55, 0.8);
            `;
            document.body.appendChild(cheers);
            setTimeout(() => cheers.remove(), 2000);

            // 添加微醺效果
            document.body.style.filter = `hue-rotate(${wineLevel * 5}deg) brightness(${1 + wineLevel * 0.05})`;
        });

        // 自动朗诵模拟
        let isPlaying = false;
        document.getElementById('playBtn').addEventListener('click', function() {
            isPlaying = !isPlaying;
            this.textContent = isPlaying ? '⏸' : '▶';
            document.getElementById('musicWaves').classList.toggle('active', isPlaying);
            
            if (isPlaying) {
                // 模拟朗诵高亮
                let currentLine = 0;
                const allLines = document.querySelectorAll('.line');
                window.readingInterval = setInterval(() => {
                    allLines.forEach(l => l.style.color = '');
                    if (currentLine < allLines.length) {
                        allLines[currentLine].style.color = '#d4af37';
                        allLines[currentLine].scrollIntoView({ behavior: 'smooth', block: 'center' });
                        currentLine++;
                    } else {
                        currentLine = 0;
                    }
                }, 3000);
            } else {
                clearInterval(window.readingInterval);
                document.querySelectorAll('.line').forEach(l => l.style.color = '');
            }
        });

        // 氛围切换
        let lightMode = false;
        document.getElementById('lightBtn').addEventListener('click', function() {
            lightMode = !lightMode;
            if (lightMode) {
                document.body.style.background = '#f4e4c1';
                document.body.style.color = '#1a1a2e';
                document.querySelector('.poem-container').style.background = 'rgba(255,255,255,0.6)';
                document.querySelectorAll('.line').forEach(l => l.style.color = '#1a1a2e');
            } else {
                document.body.style.background = '#0a0a0a';
                document.body.style.color = '#f4e4c1';
                document.querySelector('.poem-container').style.background = 'rgba(0,0,0,0.4)';
                document.querySelectorAll('.line').forEach(l => l.style.color = '');
            }
        });

        // 添加浮动动画CSS
        const style = document.createElement('style');
        style.textContent = `
            @keyframes floatUp {
                0% { opacity: 1; transform: translateY(0) scale(1); }
                100% { opacity: 0; transform: translateY(-100px) scale(1.5); }
            }
        `;
        document.head.appendChild(style);

        // 初始化
        window.addEventListener('load', () => {
            createParticles();
            setTimeout(revealPoem, 500);
        });

        // 鼠标移动视差效果
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth - e.pageX) / 50;
            const y = (window.innerHeight - e.pageY) / 50;
            document.querySelector('.background').style.transform = `translate(${x}px, ${y}px)`;
        });
    </script>
</body>
</html>
